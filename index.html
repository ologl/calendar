<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --border: #cccccc;
    --text: #000000;
    --text-muted: #888888;
    --accent: #000000;
    --accent-light: #f0f0f0;
    --event-bg: #2d5a8e;
    --event-text: #ffffff;
    --today: #f4f4f4;
    --hour-h: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1.2rem 2rem;
    border-bottom: 2px solid #000;
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    flex-wrap: wrap;
    background: var(--surface);
  }

  header h1 {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text);
  }

  header h1 span {
    color: var(--text-muted);
    font-weight: 300;
  }

  .week-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-left: auto;
    padding-right: 0.5rem;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--surface);
    padding: 0.8rem 2rem;
    border-bottom: 1px solid var(--border);
  }

  nav button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 0.85rem;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }

  nav button:hover {
    background: #000;
    color: #fff;
    border-color: #000;
  }

  #week-range {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    min-width: 220px;
    text-align: center;
  }

  .calendar-wrap {
    flex: 1;
    overflow-x: auto;
    padding: 1.5rem 2rem 3rem;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: 52px repeat(7, 1fr);
    min-width: 720px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  /* Day headers */
  .day-header {
    padding: 0.6rem 0.4rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    background: var(--surface);
  }

  .day-header:last-child { border-right: none; }

  .day-header .dow {
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .day-header .dom {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--text);
    line-height: 1.1;
  }

  .day-header.has-event .dom { color: #000; font-weight: 500; }
  .day-header.is-today { background: var(--today); }

  .period-tag {
    font-size: 0.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
    font-weight: 600;
  }

  .time-gutter {
    grid-column: 1;
    border-right: 1px solid var(--border);
  }

  .time-label {
    height: var(--hour-h);
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 3px 6px 0 0;
    font-size: 0.6rem;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
  }

  .time-label:last-child { border-bottom: none; }

  /* Day columns */
  .day-col {
    position: relative;
    border-right: 1px solid var(--border);
  }

  .day-col:last-child { border-right: none; }

  .hour-slot {
    height: var(--hour-h);
    border-bottom: 1px solid var(--border);
  }

  .hour-slot.half { border-bottom: 1px dashed #e5ddd0; height: calc(var(--hour-h) / 2); }

  /* Events */
  .event-block {
    position: absolute;
    left: 3px;
    right: 3px;
    background: var(--event-bg);
    color: var(--event-text);
    border-radius: 3px;
    padding: 4px 6px;
    font-size: 0.62rem;
    line-height: 1.35;
    overflow: hidden;
    cursor: default;
    z-index: 2;
    transition: filter 0.15s;
  }

  .event-block:hover { filter: brightness(1.15); z-index: 10; }

  /* Category colors */
  .event-block.cat-tasks {
    background: #c0392b;
    color: #ffffff;
  }

  .event-block.cat-work {
    background: #2d5a8e;
    color: #ffffff;
  }

  .event-block.cat-travel {
    background: #2e7d4f;
    color: #ffffff;
  }

  .event-block.cat-personal {
    background: #6a3d9a;
    color: #ffffff;
  }

  .event-block.cat-optional {
    background: #0d9488;
    color: #ffffff;
  }

  .event-block.cat-medical {
    background-color: #ffffff;
    background-image: repeating-linear-gradient(
      45deg,
      rgba(200, 30, 30, 0.35),
      rgba(200, 30, 30, 0.35) 8px,
      rgba(255, 255, 255, 0.35) 8px,
      rgba(255, 255, 255, 0.35) 16px
    );
    color: #7a1f1f;
    border: 1px solid rgba(200, 30, 30, 0.4);
  }

  .event-block.cat-medical .ev-time,
  .event-block.cat-medical .ev-loc {
    color: #7a1f1f;
  }

  /* Priority stripe (e.g. for festival acts): overlays category color, doesn't replace it */
  .event-block.priority-must {
    border-left: 4px solid #e02424;
  }

  .event-block.priority-wanna {
    border-left: 4px solid #ec4899;
  }

  .event-block.priority-maybe {
    border-left: 4px solid #16a34a;
  }

  .event-block .ev-time {
    font-size: 0.58rem;
    opacity: 0.75;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }

  .event-block .ev-title {
    font-weight: 500;
    font-size: 0.63rem;
    letter-spacing: 0.01em;
  }

  .event-block .ev-loc {
    font-size: 0.57rem;
    opacity: 0.7;
    margin-top: 2px;
    font-style: italic;
  }

  .empty-week {
    grid-column: 2 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem;
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  /* Corner cell */
  .corner {
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    background: var(--surface);
  }

  /* Tooltip */
  .tooltip {
    display: none;
    position: fixed;
    background: var(--text);
    color: #fff;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 0.68rem;
    padding: 0.7rem 0.9rem;
    border-radius: 3px;
    max-width: 280px;
    z-index: 100;
    line-height: 1.5;
    pointer-events: none;
  }

  .tooltip.visible { display: block; }

  footer {
    padding: 1rem 2rem;
    font-size: 0.62rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    letter-spacing: 0.08em;
    background: var(--surface);
  }

  @media (max-width: 600px) {
    header { padding: 1rem; }
    nav {
      padding: 0.6rem 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    #week-range {
      order: -1;
      width: 100%;
      min-width: 0;
      margin-bottom: 0.4rem;
    }
    nav button {
      font-size: 0.72rem;
      padding: 0.35rem 0.55rem;
      flex: 0 1 auto;
    }
    .calendar-wrap { padding: 0.8rem 0.5rem 2rem; }
    header h1 { font-size: 1.2rem; }
  }
</style>
</head>

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// Parse time string to fractional hours
function timeToHours(t) {
  const [h, m] = t.split(':').map(Number);
  return h + m / 60;
}

function dateKey(d) {
  return d.toISOString().slice(0, 10);
}

// Get Monday of a week containing date d
function getMonday(d) {
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1 - day);
  const m = new Date(d);
  m.setDate(d.getDate() + diff);
  return m;
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

EVENTS.forEach(e => {

  eventsByDate[e.date].push(e);

const firstEvent = new Date(Math.min(...eventDates));
const lastEvent = new Date(Math.max(...eventDates));

// Start on the week containing today's date
let currentMonday = getMonday(new Date());

function addMonths(d, n) {
  const r = new Date(d);
  r.setMonth(r.getMonth() + n);
  return r;
}

// Lay out overlapping events within a single day into side-by-side columns
function layoutDayEvents(dayEvents) {
  const items = dayEvents.map(ev => ({
    ev,
    startH: timeToHours(ev.start),
    endH: timeToHours(ev.end)
  }));
  items.sort((a, b) => a.startH - b.startH || a.endH - b.endH);

  const clusters = [];
  let current = [];
  let currentMaxEnd = -Infinity;
  items.forEach(item => {
    if (current.length === 0 || item.startH < currentMaxEnd) {
      current.push(item);
      currentMaxEnd = Math.max(currentMaxEnd, item.endH);
    } else {
      clusters.push(current);
      current = [item];
      currentMaxEnd = item.endH;
    }
  });
  if (current.length) clusters.push(current);

  const result = [];
  clusters.forEach(cluster => {
    const colEnds = [];
    cluster.forEach(item => {
      let placedCol = -1;
      for (let c = 0; c < colEnds.length; c++) {
        if (colEnds[c] <= item.startH) {
          colEnds[c] = item.endH;
          placedCol = c;
          break;
        }
      }
      if (placedCol === -1) {
        colEnds.push(item.endH);
        placedCol = colEnds.length - 1;
      }
      item.col = placedCol;
    });
    const totalCols = colEnds.length;
    cluster.forEach(item => {
      result.push({ ev: item.ev, startH: item.startH, endH: item.endH, col: item.col, cols: totalCols });
    });
  });
  return result;
}

function renderWeek(monday) {
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const days = Array.from({length: 7}, (_, i) => addDays(monday, i));
  const dayKeys = days.map(dateKey);
  const today = dateKey(new Date());

  // Determine time range dynamically
  let minHour = 22, maxHour = 8;
  let hasEvents = false;

  dayKeys.forEach(dk => {
    if (eventsByDate[dk]) {
      hasEvents = true;
      eventsByDate[dk].forEach(e => {
        const s = timeToHours(e.start);
        const en = timeToHours(e.end);
        minHour = Math.min(minHour, Math.floor(s));
        maxHour = Math.max(maxHour, Math.ceil(en));
      });
    }
  });

  // Clamp to a wide range covering early-morning and past-midnight events
  if (!hasEvents) { minHour = 8; maxHour = 18; }
  minHour = Math.max(0, minHour);
  maxHour = Math.min(26, maxHour);

  // Add padding
  minHour = Math.max(0, minHour - 1);
  maxHour = Math.min(26, maxHour + 1);

  const hours = Array.from({length: maxHour - minHour}, (_, i) => minHour + i);

  // Update week range label
  const endSunday = addDays(monday, 6);
  document.getElementById('week-range').textContent =
    `${days[0].getDate()} ${MONTHS[days[0].getMonth()]} – ${endSunday.getDate()} ${MONTHS[endSunday.getMonth()]} ${endSunday.getFullYear()}`;

  // Corner
  const corner = document.createElement('div');
  corner.className = 'corner';
  grid.appendChild(corner);

  // Day headers
  days.forEach((d, i) => {
    const h = document.createElement('div');
    h.className = 'day-header';
    if (dayKeys[i] === today) h.classList.add('is-today');
    if (eventsByDate[dayKeys[i]]) h.classList.add('has-event');
    const period = getPeriodForDate(dayKeys[i]);
    const periodTag = period ? `<div class="period-tag" style="color:${period.textColor}">${period.label}</div>` : '';
    h.innerHTML = `<div class="dow">${DAYS[i]}</div><div class="dom">${d.getDate()}</div>${periodTag}`;
    grid.appendChild(h);
  });

  // Time gutter
  const gutter = document.createElement('div');
  gutter.className = 'time-gutter';
  hours.forEach(h => {
    const lbl = document.createElement('div');
    lbl.className = 'time-label';
    lbl.textContent = `${String(h).padStart(2,'0')}:00`;
    gutter.appendChild(lbl);
  });
  grid.appendChild(gutter);

  // Day columns
  days.forEach((d, di) => {
    const col = document.createElement('div');
    col.className = 'day-col';
    col.style.position = 'relative';

    const dk = dayKeys[di];
    const period = getPeriodForDate(dk);
    if (period) col.style.background = period.color;

    // Hour slots
    hours.forEach(() => {
      const slot = document.createElement('div');
      slot.className = 'hour-slot';
      col.appendChild(slot);
    });

    // Events (laid out side-by-side if they overlap)
    if (eventsByDate[dk]) {
      const laidOut = layoutDayEvents(eventsByDate[dk]);
      laidOut.forEach(({ ev, startH, endH, col: colIdx, cols }) => {
        const GAP_PX = 3; // visual whitespace between vertically adjacent blocks
        const top = (startH - minHour) * 56 + GAP_PX / 2; // px per hour = --hour-h
        const height = (endH - startH) * 56 - GAP_PX;

        const block = document.createElement('div');
        block.className = `event-block cat-${ev.category || 'work'}${ev.priority ? ' priority-' + ev.priority : ''}`;
        block.style.top = `${top}px`;
        block.style.height = `${Math.max(height, 24)}px`;
        block.style.left = `calc(${(colIdx / cols) * 100}% + 2px)`;
        block.style.right = 'auto';
        block.style.width = `calc(${100 / cols}% - 4px)`;
        block.innerHTML = `
          <div class="ev-time">${ev.start}–${ev.end}</div>
          <div class="ev-title">${ev.title}</div>
          <div class="ev-loc">${ev.loc}</div>
        `;

        // Tooltip
        block.addEventListener('mouseenter', (e) => showTooltip(e, ev));
        block.addEventListener('mousemove', (e) => moveTooltip(e));
        block.addEventListener('mouseleave', hideTooltip);
        block.addEventListener('touchstart', (e) => {
          e.stopPropagation();
          showTooltip(e.touches[0], ev);
        }, {passive: true});

        col.appendChild(block);
      });
    }

    grid.appendChild(col);
  });
}

// Tooltip
const tooltip = document.getElementById('tooltip');

function showTooltip(e, ev) {
  tooltip.innerHTML = `<strong>${ev.title}</strong><br>${ev.start}–${ev.end}<br>${ev.loc}${ev.desc ? '<br><br>' + ev.desc : ''}`;
  tooltip.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  const margin = 8;
  const tw = 300; // approx tooltip width incl. padding
  const th = 170; // approx tooltip max height

  let x = e.clientX + 14;
  let y = e.clientY + 14;

  // Flip if it would overflow the right/bottom edge
  if (x + tw > window.innerWidth - margin) x = e.clientX - tw - 14;
  if (y + th > window.innerHeight - margin) y = e.clientY - th - 14;

  // Clamp so it never goes off the left/top edge either
  x = Math.max(margin, Math.min(x, window.innerWidth - tw - margin));
  y = Math.max(margin, Math.min(y, window.innerHeight - th - margin));

  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

document.addEventListener('touchstart', (e) => {
  if (!e.target.closest('.event-block')) hideTooltip();
}, {passive: true});

// Navigation
document.getElementById('prev').addEventListener('click', () => {
  currentMonday = addDays(currentMonday, -7);
  renderWeek(currentMonday);
});

document.getElementById('next').addEventListener('click', () => {
  currentMonday = addDays(currentMonday, 7);
  renderWeek(currentMonday);
});

document.getElementById('prev-month').addEventListener('click', () => {
  currentMonday = getMonday(addMonths(currentMonday, -1));
  renderWeek(currentMonday);
});

document.getElementById('next-month').addEventListener('click', () => {
  currentMonday = getMonday(addMonths(currentMonday, 1));
  renderWeek(currentMonday);
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') {
    currentMonday = addDays(currentMonday, 7);
    renderWeek(currentMonday);
  }
  if (e.key === 'ArrowLeft') {
    currentMonday = addDays(currentMonday, -7);
    renderWeek(currentMonday);
  }
});

// Init
renderWeek(currentMonday);
</script>
